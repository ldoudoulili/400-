name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: 安卓App
        run: npm install

      - name: Sync Capacitor web assets
        working-directory: 安卓App
        run: npx cap sync android

      - name: Grant gradlew execute permission
        working-directory: 安卓App/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: 安卓App/android
        run: |
          ./gradlew assembleDebug --no-daemon || {
            echo "assembleDebug failed, running clean and retrying..."
            ./gradlew clean
            ./gradlew assembleDebug --no-daemon
          }

      - name: Rename APK
        working-directory: 安卓App/android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/400电话记录-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 400电话记录-debug
          path: 安卓App/android/app/build/outputs/apk/debug/400电话记录-debug.apk
